<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Workout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/styles.css" />
    <meta name="darkreader-lock" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Local workout app where you can create custom routines completely free."
    />
    <link rel="canonical" href="https://workout.crizorr.com/" />
    <link rel="favicon" href="https://workout.crizorr.com/assets/favicon.png" />
    <link rel="icon" href="https://workout.crizorr.com/assets/favicon.png" />
    <link
      rel="apple-touch-icon"
      href="https://workout.crizorr.com/assets/favicon.png"
    />
    <meta name="theme-color" content="#00b153" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      name="twitter:title"
      content="Custom Workout App"
    />
    <meta
      property="og:image"
      name="twitter:image"
      content="https://genshin.crizorr.com/assets/hero-image.png"
    />
    <meta
      property="og:url"
      name="twitter:url"
      content="https://workout.crizorr.com"
    />
    <meta
      property="og:description"
      name="twitter:description"
      content="Local workout app where you can create custom routines completely free."
    />
    <style class="keyframe"></style>
  </head>
  <body class="bg-white">
    <header class="header hidden-deg"></header>
    <main class="main">
      <article
        class="home-page md-2col lg-3col max-container dp-none"
      ></article>
      <article
        class="calendar-page md-2col lg-3col max-container dp-none"
      ></article>
      <article
        class="settings-page md-2col lg-3col max-container dp-none"
      ></article>
    </main>
    <section class="interaction-container dp-none">
      <article
        class="create-page radio-sm-lg bg-white shadow-green-lg dp-none"
      ></article>
      <article
        class="action-page radio-sm-lg bg-white shadow-green-lg dp-none"
      ></article>
    </section>
    <section class="modal-container dp-none"></section>
    <section class="notification-container dp-none">
      <div class="notification hide"></div>
    </section>
    <script type="module" src="./index.js"></script>
  </body>
</html>
