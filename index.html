<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Workout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body>
    <header class="header">
      <section class="header-container bg-fst">
        <article class="icon-text">
          <img
            class="icon icon-xs-lg"
            src="./assets/icons/home.svg"
            alt="Home"
          />
          <p class="txt-bold txt-s4 txt-white dp-none dp-block-sm">Home</p>
        </article>
        <article class="icon-text">
          <img
            class="icon icon-xs-lg"
            src="./assets/icons/calendar.svg"
            alt="Calendar"
          />
          <p class="txt-bold txt-s4 txt-white dp-none dp-block-sm">Calendar</p>
        </article>
        <article class="icon-text">
          <img
            class="icon icon-xs-lg"
            src="./assets/icons/settings.svg"
            alt="Settings"
          />
          <p class="txt-bold txt-s4 txt-white dp-none dp-block-sm">Settings</p>
        </article>
      </section>
    </header>
  </body>
</html>
