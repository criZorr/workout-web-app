<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Workout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body>
    <header class="header">
      <section class="header-container bg-fst">
        <article class="icon-text">
          <img
            class="icon icon-xs-lg"
            src="./assets/icons/home.svg"
            alt="Home"
          />
          <p class="txt-bold txt-s4 txt-white dp-none dp-block-sm">Home</p>
        </article>
        <article class="icon-text">
          <img
            class="icon icon-xs-lg"
            src="./assets/icons/calendar.svg"
            alt="Calendar"
          />
          <p class="txt-bold txt-s4 txt-white dp-none dp-block-sm">Calendar</p>
        </article>
        <article class="icon-text">
          <img
            class="icon icon-xs-lg"
            src="./assets/icons/settings.svg"
            alt="Settings"
          />
          <p class="txt-bold txt-s4 txt-white dp-none dp-block-sm">Settings</p>
        </article>
      </section>
    </header>
    <main class="main md-2col lg-3col max-container">
      <section class="card-oneline bg-white shadow">
        <section class="list-btn">
          <p class="txt-s4 txt-semibold">Create routine</p>
          <div class="btn-icon bg-fst">
            <div class="icon-svg">
              <svg
                viewBox="0 0 16 16"
                xmlns="http://www.w3.org/2000/svg"
                fill="auto"
              >
                <path
                  class="fill-light"
                  d="M10.4 0H5.6V5.59688H0V10.4031H5.6V16H10.4V10.4031H16V5.59688H10.4V0Z"
                />
              </svg>
            </div>
          </div>
        </section>
      </section>
      <!-- <section class="card-img bg-white shadow">
        <img class="banner-img" src="./assets/img/placeholder.jpg" alt="" />
        <div class="card-label">
          <section class="btn-options">
            <p class="txt-s4 txt-s3-sm txt-semibold">Routine name</p>
            <div class="btn-container">
              <div class="btn bg-fst">
                <div class="icon-container">
                  <img class="" src="./assets/icons/play.svg" alt="Calendar" />
                </div>
              </div>
            </div>
          </section>
        </div>
      </section> -->
    </main>
  </body>
</html>
